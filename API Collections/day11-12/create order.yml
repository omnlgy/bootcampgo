info:
  name: create order
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/orders
  body:
    type: json
    data: |-
      {
        "user_id": 1, 
        "items": [
          {"product_id": 1, "quantity": 2}
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
